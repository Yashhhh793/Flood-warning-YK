<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlashGuard | Hyper-Local Flash Flood Early Warning</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1220;
  --panel: #121b2e;
  --panel-2: #17223a;
  --border: #223154;
  --text: #e7edf7;
  --muted: #8ea0c2;
  --accent: #3b82f6;
  --low: #22c55e;
  --moderate: #eab308;
  --high: #f97316;
  --critical: #ef4444;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 22px;
  background: linear-gradient(180deg, #0d1626, #0b1220);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 12px; }

.brand-mark {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, #3b82f6, #22d3ee);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 14px; color: #051324;
  letter-spacing: 0.5px;
}

.brand-title { font-weight: 800; font-size: 18px; letter-spacing: 1px; }
.brand-sub { font-size: 12px; color: var(--muted); }

.topbar-right { display: flex; align-items: center; gap: 14px; }
.muted { color: var(--muted); font-size: 13px; }

.btn-primary, .btn-secondary {
  border: none; border-radius: 8px; padding: 9px 16px;
  font-weight: 600; font-size: 13px; cursor: pointer;
  transition: transform 0.1s ease, opacity 0.15s ease;
}
.btn-primary { background: var(--accent); color: white; }
.btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); width: 100%; margin-top: 8px; }
.btn-primary:hover, .btn-secondary:hover { opacity: 0.88; }
.btn-primary:active, .btn-secondary:active { transform: scale(0.97); }

.layout {
  display: flex;
  height: calc(100vh - 65px);
}

.sidebar {
  width: 340px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 16px;
  overflow-y: auto;
  flex-shrink: 0;
}

.summary-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 18px;
}

.summary-card {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
}
.summary-card .count { font-size: 22px; font-weight: 800; }
.summary-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }

.search-box {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 18px;
}
.search-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.search-row { display: flex; gap: 8px; margin-bottom: 8px; }
.search-box input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 7px;
  padding: 8px 10px;
  font-size: 13px;
  margin-bottom: 0;
}

.search-box select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 7px;
  padding: 8px 10px;
  font-size: 13px;
  margin-bottom: 8px;
  appearance: none;
  -webkit-appearance: none;
}
.search-box select:disabled { opacity: 0.5; }

.location-list-title {
  font-size: 12px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.6px; margin: 10px 4px;
}

.location-list { display: flex; flex-direction: column; gap: 8px; }

.loc-card {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-left: 4px solid var(--muted);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  transition: background 0.15s ease;
}
.loc-card:hover { background: #1c2942; }
.loc-card .name { font-weight: 600; font-size: 13.5px; }
.loc-card .meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; justify-content: space-between; }
.loc-card .risk-tag {
  font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
  color: #051324; display: inline-block;
}

.map-wrap { flex: 1; position: relative; }
#map { width: 100%; height: 100%; background: #0b1220; cursor: crosshair; }

.detail-panel {
  position: absolute;
  top: 16px; right: 16px;
  width: 300px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.4);
  z-index: 1000;
}
.detail-panel.hidden { display: none; }
.detail-panel h3 { margin: 0 0 4px 0; font-size: 15px; }
.detail-panel .risk-big {
  font-size: 22px; font-weight: 800; margin: 8px 0 12px 0;
}
.detail-panel .row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed var(--border); }
.detail-panel .action-box {
  margin-top: 12px; background: var(--panel-2); border-radius: 8px; padding: 10px; font-size: 12.5px; line-height: 1.4;
}
.detail-panel .src { font-size: 10.5px; color: var(--muted); margin-top: 10px; }
.detail-panel .close-x {
  position: absolute; top: 10px; right: 12px; cursor: pointer; color: var(--muted); font-size: 16px;
}

.leaflet-popup-content-wrapper {
  background: var(--panel); color: var(--text); border-radius: 8px;
}
.leaflet-popup-tip { background: var(--panel); }

</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">FG</div>
    <div>
      <div class="brand-title">FLASHGUARD</div>
      <div class="brand-sub">Hyper-Local Flash Flood Prediction &amp; Early Warning</div>
    </div>
  </div>
  <div class="topbar-right">
    <span id="last-updated" class="muted">—</span>
    <button id="refresh-btn" class="btn-primary">⟳ Refresh</button>
  </div>
</header>

<div class="layout">

  <aside class="sidebar">
    <div class="summary-cards" id="summary-cards"></div>

      <div class="search-box">

      <select id="state-select">
        <option value="">Select State</option>
      </select>
      <select id="city-select" disabled>
        <option value="">Select City / District</option>
      </select>
      <div class="search-row">
        <input id="lat-input" type="text" placeholder="Latitude" />
        <input id="lon-input" type="text" placeholder="Longitude" />
      </div>
      <input id="name-input" type="text" placeholder="Location name (auto-filled)" />
      <button id="check-btn" class="btn-secondary">Predict Risk</button>

    <div id="location-list" class="location-list"></div>

  <main class="map-wrap">
    <div id="map"></div>
    <div id="detail-panel" class="detail-panel hidden"></div>

</div>

let map = L.map("map", { zoomControl: true }).setView([30.3, 79.0], 6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors",
  maxZoom: 18,
}).addTo(map);

let markers = {};

function riskBadge(level) {
  const c = RISK_COLORS[level] || "#888";
  return `<span class="risk-tag" style="background:${c}">${level}</span>`;
}

function renderSummary(locations) {
  const counts = { LOW: 0, MODERATE: 0, HIGH: 0, CRITICAL: 0 };
  locations.forEach((l) => counts[l.risk_level] = (counts[l.risk_level] || 0) + 1);
  const el = document.getElementById("summary-cards");
  el.innerHTML = Object.keys(counts).map((k) => `
    <div class="summary-card" style="border-top:3px solid ${RISK_COLORS[k]}">
      <div class="count">${counts[k]}</div>
      <div class="label">${k}</div>
    </div>
  `).join("");
}

function renderList(locations) {
  const el = document.getElementById("location-list");
  el.innerHTML = locations.map((l) => `
    <div class="loc-card" style="border-left-color:${RISK_COLORS[l.risk_level]}" data-id="${l.id || l.name}">
      <div class="name">${l.name}</div>
      <div class="meta">
        <span>${riskBadge(l.risk_level)}</span>
        <span>${l.inputs.rainfall_24h_mm} mm / 24h</span>
      </div>
    </div>
  `).join("");

  el.querySelectorAll(".loc-card").forEach((card, i) => {
    card.addEventListener("click", () => {
      const loc = locations[i];
      map.flyTo([loc.lat, loc.lon], 10);
      showDetail(loc);
      if (markers[loc.id]) markers[loc.id].openPopup();
    });
  });
}

function markerIcon(level) {
  return L.divIcon({
    className: "",
    html: `<div style="width:18px;height:18px;border-radius:50%;background:${RISK_COLORS[level]};border:2px solid #0b1220;box-shadow:0 0 8px ${RISK_COLORS[level]}"></div>`,
    iconSize: [18, 18],
  });
}

function renderMarkers(locations) {
  Object.values(markers).forEach((m) => map.removeLayer(m));
  markers = {};
  locations.forEach((loc) => {
    const m = L.marker([loc.lat, loc.lon], { icon: markerIcon(loc.risk_level) }).addTo(map);
    m.bindPopup(`
      <b>${loc.name}</b><br/>
      Risk: <b style="color:${RISK_COLORS[loc.risk_level]}">${loc.risk_level}</b><br/>
      24h rainfall: ${loc.inputs.rainfall_24h_mm} mm<br/>
      Soil moisture: ${loc.inputs.soil_moisture_m3m3}
    `);
    m.on("click", () => showDetail(loc));
    markers[loc.id || loc.name] = m;
  });
}

function showDetail(loc) {
  const panel = document.getElementById("detail-panel");
  panel.classList.remove("hidden");
  panel.innerHTML = `
    <span class="close-x" onclick="document.getElementById('detail-panel').classList.add('hidden')">✕</span>
    <h3>${loc.name}</h3>
    <div class="risk-big" style="color:${RISK_COLORS[loc.risk_level]}">${loc.risk_level}</div>
    <div class="row"><span>Lead time</span><b>${loc.lead_time_hours ? loc.lead_time_hours + " hrs" : "—"}</b></div>
    <div class="row"><span>1h rainfall</span><b>${loc.inputs.rainfall_1h_mm} mm</b></div>
    <div class="row"><span>6h rainfall</span><b>${loc.inputs.rainfall_6h_mm} mm</b></div>
    <div class="row"><span>24h rainfall</span><b>${loc.inputs.rainfall_24h_mm} mm</b></div>
    <div class="row"><span>Antecedent 72h</span><b>${loc.inputs.antecedent_rainfall_72h_mm} mm</b></div>
    <div class="row"><span>Soil moisture</span><b>${loc.inputs.soil_moisture_m3m3}</b></div>
    <div class="row"><span>Slope</span><b>${loc.inputs.slope_deg}°</b></div>
    <div class="row"><span>Elevation</span><b>${loc.inputs.elevation_m} m</b></div>
    <div class="action-box"><b>Recommended action</b><br/>${loc.recommended_action}</div>
    <div class="src">Weather: ${loc.data_sources.weather}<br/>Terrain: ${loc.data_sources.terrain}</div>
  `;
}

async function loadDashboard() {
  document.getElementById("refresh-btn").textContent = "⟳ Loading...";
  try {
    const res = await fetch("/api/dashboard");
    const data = await res.json();
    renderSummary(data.locations);
    renderList(data.locations);
    renderMarkers(data.locations);
    document.getElementById("last-updated").textContent =
      "Updated " + new Date(data.generated_at * 1000).toLocaleTimeString();
  } catch (e) {
    document.getElementById("last-updated").textContent = "Failed to load: " + e;
  }
  document.getElementById("refresh-btn").textContent = "⟳ Refresh";
}

document.getElementById("refresh-btn").addEventListener("click", loadDashboard);

// ---------------------------------------------------------------
// State -> City/District dropdown wiring
// ---------------------------------------------------------------
const stateSelect = document.getElementById("state-select");
const citySelect = document.getElementById("city-select");
const latInput = document.getElementById("lat-input");
const lonInput = document.getElementById("lon-input");
const nameInput = document.getElementById("name-input");

Object.keys(INDIA_LOCATIONS).sort().forEach((state) => {
  const opt = document.createElement("option");
  opt.value = state;
  opt.textContent = state;
  stateSelect.appendChild(opt);
});

stateSelect.addEventListener("change", () => {
  const state = stateSelect.value;
  citySelect.innerHTML = '<option value="">Select City / District</option>';
  if (!state) {
    citySelect.disabled = true;
    return;
  }
  citySelect.disabled = false;
  INDIA_LOCATIONS[state].forEach((city) => {
    const opt = document.createElement("option");
    opt.value = city.name;
    opt.textContent = city.name;
    opt.dataset.lat = city.lat;
    opt.dataset.lon = city.lon;
    citySelect.appendChild(opt);
  });
});

citySelect.addEventListener("change", () => {
  const opt = citySelect.selectedOptions[0];
  if (!opt || !opt.dataset.lat) return;
  latInput.value = opt.dataset.lat;
  lonInput.value = opt.dataset.lon;
  nameInput.value = `${opt.value}, ${stateSelect.value}`;
});

async function checkLocation(lat, lon, name) {
  const res = await fetch(`/api/predict?lat=${lat}&lon=${lon}&name=${encodeURIComponent(name)}`);
  const loc = await res.json();
  loc.id = "custom-" + Date.now();
  map.flyTo([lat, lon], 11);
  const m = L.marker([lat, lon], { icon: markerIcon(loc.risk_level) }).addTo(map);
  m.bindPopup(`<b>${loc.name}</b><br/>Risk: <b style="color:${RISK_COLORS[loc.risk_level]}">${loc.risk_level}</b>`).openPopup();
  showDetail(loc);
  latInput.value = lat;
  lonInput.value = lon;
  nameInput.value = name;
  return loc;
}

document.getElementById("check-btn").addEventListener("click", async () => {
  const lat = parseFloat(latInput.value);
  const lon = parseFloat(lonInput.value);
  const name = nameInput.value || "Custom location";
  if (isNaN(lat) || isNaN(lon)) {
    alert("Please select a State + City, or enter latitude/longitude directly.");
    return;
  }
  await checkLocation(lat, lon, name);
});

// Click anywhere on the map -> fetch live risk for that exact point
map.on("click", async (e) => {
  const lat = e.latlng.lat.toFixed(4);
  const lon = e.latlng.lng.toFixed(4);
  await checkLocation(lat, lon, `Map point (${lat}, ${lon})`);
});

loadDashboard();

</script>
