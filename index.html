<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FlashGuard | Hyper-Local Flash Flood Early Warning</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070c17;
  --panel: #0f1626;
  --panel-2: #141d33;
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.09);
  --border: #202c47;
  --text: #eef2fb;
  --muted: #8a99bf;
  --accent: #4f7cff;
  --accent-2: #22d3ee;
  --low: #22c55e;
  --moderate: #eab308;
  --high: #f97316;
  --critical: #ef4444;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
}

h1, h2, h3, .brand-title, .risk-big, .count { font-family: 'Poppins', sans-serif; }

/* ---------- animated backdrop ---------- */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.28;
  z-index: 0;
  pointer-events: none;
}
.bg-orb.one { width: 480px; height: 480px; background: #3b5bff; top: -160px; left: -120px; animation: float1 22s ease-in-out infinite; }
.bg-orb.two { width: 420px; height: 420px; background: #22d3ee; bottom: -160px; right: -100px; animation: float2 26s ease-in-out infinite; }
.bg-orb.three { width: 320px; height: 320px; background: #f97316; top: 40%; right: 20%; opacity: 0.12; animation: float1 30s ease-in-out infinite reverse; }
@keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px, 40px); } }
@keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px, -30px); } }

/* ---------- layout shell ---------- */
.app { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  background: rgba(10,15,28,0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--glass-border);
  flex-shrink: 0;
  z-index: 30;
}

.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

.hamburger {
  display: none;
  width: 38px; height: 38px;
  border-radius: 10px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  color: var(--text);
  align-items: center; justify-content: center;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
}

.brand-mark {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, #4f7cff, #22d3ee);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 15px; color: #051020;
  box-shadow: 0 6px 20px rgba(79,124,255,0.45);
  flex-shrink: 0;
}

.brand-title { font-weight: 800; font-size: 17px; letter-spacing: 0.6px; background: linear-gradient(90deg,#fff,#b9c8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.topbar-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.muted { color: var(--muted); font-size: 12px; display: none; }
@media (min-width: 640px) { .muted { display: inline; } }

.btn-primary {
  border: none; border-radius: 10px; padding: 10px 16px;
  font-weight: 600; font-size: 13px; cursor: pointer;
  background: linear-gradient(135deg, var(--accent), #6b5bff);
  color: white;
  display: flex; align-items: center; gap: 7px;
  box-shadow: 0 6px 18px rgba(79,124,255,0.35);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.btn-primary:active { transform: scale(0.96); }
.btn-primary.spinning svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.btn-secondary {
  border: 1px solid var(--glass-border);
  background: var(--glass);
  color: var(--text);
  border-radius: 10px;
  padding: 11px 14px;
  font-weight: 600; font-size: 13.5px;
  width: 100%; margin-top: 10px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 0.15s ease, transform 0.1s ease;
}
.btn-secondary:hover { background: rgba(255,255,255,0.08); }
.btn-secondary:active { transform: scale(0.98); }

/* ---------- main split ---------- */
.layout { flex: 1; display: flex; min-height: 0; position: relative; }

.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 39;
}

.sidebar {
  width: 350px;
  background: rgba(12,18,32,0.92);
  backdrop-filter: blur(10px);
  border-right: 1px solid var(--glass-border);
  padding: 16px;
  overflow-y: auto;
  flex-shrink: 0;
  scrollbar-width: thin;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.summary-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.summary-card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 14px 14px 12px;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s ease;
}
.summary-card:hover { transform: translateY(-2px); }
.summary-card::after {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--dot);
}
.summary-card .count { font-size: 26px; font-weight: 800; line-height: 1; }
.summary-card .label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 4px; }
.summary-card .icon { position: absolute; right: 10px; top: 10px; font-size: 18px; opacity: 0.5; }

.section-card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 18px;
}
.search-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }

.field-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 10px 0 5px; }
.field-label:first-child { margin-top: 0; }

.search-row { display: flex; gap: 8px; }
.search-box input, .search-box select {
  width: 100%;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--glass-border);
  color: var(--text);
  border-radius: 9px;
  padding: 9px 11px;
  font-size: 13px;
  font-family: inherit;
  margin-bottom: 8px;
  appearance: none; -webkit-appearance: none;
  transition: border-color 0.15s ease;
}
.search-box select {
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) center, calc(100% - 11px) center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
.search-box input:focus, .search-box select:focus { outline: none; border-color: var(--accent); }
.search-box select:disabled { opacity: 0.45; }

.location-list-title {
  font-size: 11.5px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.6px; margin: 4px 4px 10px;
  display: flex; align-items: center; gap: 6px;
}

.location-list { display: flex; flex-direction: column; gap: 9px; }

.loc-card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-left: 4px solid var(--dot);
  border-radius: 11px;
  padding: 12px 13px;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
}
.loc-card:hover { background: rgba(255,255,255,0.07); transform: translateX(2px); }
.loc-card .name { font-weight: 600; font-size: 13.5px; margin-bottom: 5px; }
.loc-card .meta { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.risk-tag {
  font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  color: #06101f; display: inline-block; letter-spacing: 0.3px;
}

.skeleton { display: flex; flex-direction: column; gap: 9px; }
.skeleton-row {
  height: 58px; border-radius: 11px;
  background: linear-gradient(90deg, var(--glass) 25%, rgba(255,255,255,0.09) 37%, var(--glass) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease infinite;
}
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

/* ---------- map ---------- */
.map-wrap { flex: 1; position: relative; min-width: 0; }
#map { width: 100%; height: 100%; background: #0b1220; cursor: crosshair; }

.map-hint {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: rgba(10,15,28,0.85); backdrop-filter: blur(8px);
  border: 1px solid var(--glass-border); border-radius: 30px;
  padding: 8px 16px; font-size: 12px; color: var(--muted);
  z-index: 500; pointer-events: none;
  display: flex; align-items: center; gap: 6px;
  animation: fadeInUp 0.6s ease;
}
@keyframes fadeInUp { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

.detail-panel {
  position: absolute;
  top: 16px; right: 16px;
  width: 320px;
  max-height: calc(100% - 32px);
  overflow-y: auto;
  background: rgba(12,18,32,0.95);
  backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  z-index: 1000;
  transform: translateX(120%);
  opacity: 0;
  transition: transform 0.28s cubic-bezier(0.34,1.4,0.64,1), opacity 0.2s ease;
}
.detail-panel.show { transform: translateX(0); opacity: 1; }
.detail-panel h3 { margin: 4px 0 2px 0; font-size: 16px; padding-right: 20px; }
.detail-panel .risk-big { font-size: 26px; font-weight: 800; margin: 10px 0 4px 0; display: flex; align-items: center; gap: 8px; }
.lead-pill {
  display: inline-block; font-size: 11px; font-weight: 700; color: var(--muted);
  background: rgba(255,255,255,0.06); padding: 4px 10px; border-radius: 20px; margin-bottom: 14px;
}
.detail-panel .row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 6px 0; border-bottom: 1px dashed var(--glass-border); }
.detail-panel .row:last-of-type { border-bottom: none; }

.prob-bars { margin: 12px 0; }
.prob-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; }
.prob-row .prob-label { width: 62px; color: var(--muted); flex-shrink: 0; }
.prob-track { flex: 1; height: 7px; background: rgba(255,255,255,0.08); border-radius: 6px; overflow: hidden; }
.prob-fill { height: 100%; border-radius: 6px; transition: width 0.6s ease; }
.prob-pct { width: 34px; text-align: right; color: var(--muted); flex-shrink: 0; }

.action-box {
  margin-top: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
  border-radius: 10px; padding: 12px; font-size: 12.5px; line-height: 1.5;
}
.action-box b { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.detail-panel .src { font-size: 10px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
.close-x {
  position: absolute; top: 14px; right: 14px; cursor: pointer; color: var(--muted);
  font-size: 15px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: rgba(255,255,255,0.05); transition: background 0.15s ease;
}
.close-x:hover { background: rgba(255,255,255,0.12); }

/* ---------- toasts ---------- */
.toast-stack {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  z-index: 3000; display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none;
}
.toast {
  background: rgba(15,22,38,0.95); backdrop-filter: blur(10px);
  border: 1px solid var(--glass-border); border-left: 4px solid var(--accent);
  border-radius: 10px; padding: 11px 18px; font-size: 13px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  animation: toastIn 0.25s ease, toastOut 0.25s ease 2.6s forwards;
  max-width: 90vw;
}
.toast.error { border-left-color: var(--critical); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

.leaflet-popup-content-wrapper { background: var(--panel); color: var(--text); border-radius: 10px; }
.leaflet-popup-tip { background: var(--panel); }

/* ---------- mobile ---------- */
@media (max-width: 860px) {
  .hamburger { display: flex; }
  .brand-sub { display: none; }
  .sidebar {
    position: fixed; top: 0; bottom: 0; left: 0;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    width: min(86vw, 360px);
    transform: translateX(-105%);
    transition: transform 0.28s cubic-bezier(0.34,1.4,0.64,1);
    z-index: 40;
  }
  .sidebar.open { transform: translateX(0); }
  .overlay.show { display: block; }
  .detail-panel { left: 12px; right: 12px; width: auto; top: auto; bottom: 12px; max-height: 60vh; }
  .detail-panel.show { transform: translateY(0); }
  .detail-panel:not(.show) { transform: translateY(120%); }
}
</style>
</head>

  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>

// ---------------------------------------------------------------
// Toasts
// ---------------------------------------------------------------
function toast(message, type = "info") {
  const stack = document.getElementById("toast-stack");
  const el = document.createElement("div");
  el.className = "toast" + (type === "error" ? " error" : "");
  el.textContent = message;
  stack.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ---------------------------------------------------------------
// Map
// ---------------------------------------------------------------
let map = L.map("map", { zoomControl: true }).setView([22.5, 79.5], 5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors",
  maxZoom: 18,
}).addTo(map);

let markers = {};

function riskBadge(level) {
  const c = RISK_COLORS[level] || "#888";
  return `<span class="risk-tag" style="background:${c}">${RISK_ICONS[level] || ""} ${level}</span>`;
}

function animateCount(el, target) {
  let current = 0;
  const step = Math.max(1, Math.ceil(target / 20));
  const timer = setInterval(() => {
    current += step;
    if (current >= target) { current = target; clearInterval(timer); }
    el.textContent = current;
  }, 25);
}

function renderSummary(locations) {
  const counts = { LOW: 0, MODERATE: 0, HIGH: 0, CRITICAL: 0 };
  locations.forEach((l) => counts[l.risk_level] = (counts[l.risk_level] || 0) + 1);
  const icons = { LOW: "✅", MODERATE: "⚠️", HIGH: "🔶", CRITICAL: "🚨" };
  const el = document.getElementById("summary-cards");
  el.innerHTML = Object.keys(counts).map((k) => `
    <div class="summary-card" style="--dot:${RISK_COLORS[k]}">
      <span class="icon">${icons[k]}</span>
      <div class="count" data-target="${counts[k]}">0</div>
      <div class="label">${k}</div>
    </div>
  `).join("");
  el.querySelectorAll(".count").forEach((c) => animateCount(c, parseInt(c.dataset.target)));
}

function renderList(locations) {
  const el = document.getElementById("location-list");
  el.innerHTML = locations.map((l) => `
    <div class="loc-card" style="--dot:${RISK_COLORS[l.risk_level]}" data-id="${l.id || l.name}">
      <div class="name">${l.name}</div>
      <div class="meta">
        <span>${riskBadge(l.risk_level)}</span>
        <span>${l.inputs.rainfall_24h_mm} mm / 24h</span>
      </div>
    </div>
  `).join("");

  el.querySelectorAll(".loc-card").forEach((card, i) => {
    card.addEventListener("click", () => {
      const loc = locations[i];
      map.flyTo([loc.lat, loc.lon], 10);
      showDetail(loc);
      if (markers[loc.id]) markers[loc.id].openPopup();
      closeSidebarOnMobile();
    });
  });
}

function markerIcon(level) {
  return L.divIcon({
    className: "",
    html: `<div style="width:18px;height:18px;border-radius:50%;background:${RISK_COLORS[level]};border:2px solid #0b1220;box-shadow:0 0 10px ${RISK_COLORS[level]}"></div>`,
    iconSize: [18, 18],
  });
}

function renderMarkers(locations) {
  Object.values(markers).forEach((m) => map.removeLayer(m));
  markers = {};
  locations.forEach((loc) => {
    const m = L.marker([loc.lat, loc.lon], { icon: markerIcon(loc.risk_level) }).addTo(map);
    m.bindPopup(`
      <b>${loc.name}</b><br/>
      Risk: <b style="color:${RISK_COLORS[loc.risk_level]}">${loc.risk_level}</b><br/>
      24h rainfall: ${loc.inputs.rainfall_24h_mm} mm<br/>
      Soil moisture: ${loc.inputs.soil_moisture_m3m3}
    `);
    m.on("click", () => showDetail(loc));
    markers[loc.id || loc.name] = m;
  });
}

function showDetail(loc) {
  const panel = document.getElementById("detail-panel");
  const probs = loc.probabilities || {};
  const probRows = ["LOW", "MODERATE", "HIGH", "CRITICAL"].map((k) => {
    const pct = Math.round((probs[k] || 0) * 100);
    return `
      <div class="prob-row">
        <span class="prob-label">${k}</span>
        <div class="prob-track"><div class="prob-fill" style="width:${pct}%;background:${RISK_COLORS[k]}"></div></div>
        <span class="prob-pct">${pct}%</span>
      </div>`;
  }).join("");

  panel.innerHTML = `
    <span class="close-x" id="detail-close">✕</span>
    <h3>${loc.name}</h3>
    <div class="risk-big" style="color:${RISK_COLORS[loc.risk_level]}">${RISK_ICONS[loc.risk_level]} ${loc.risk_level}</div>
    <span class="lead-pill">⏱ Lead time: ${loc.lead_time_hours ? loc.lead_time_hours + " hrs" : "—"}</span>
    <div class="prob-bars">${probRows}</div>
    <div class="row"><span>1h rainfall</span><b>${loc.inputs.rainfall_1h_mm} mm</b></div>
    <div class="row"><span>6h rainfall</span><b>${loc.inputs.rainfall_6h_mm} mm</b></div>
    <div class="row"><span>24h rainfall</span><b>${loc.inputs.rainfall_24h_mm} mm</b></div>
    <div class="row"><span>Antecedent 72h</span><b>${loc.inputs.antecedent_rainfall_72h_mm} mm</b></div>
    <div class="row"><span>Soil moisture</span><b>${loc.inputs.soil_moisture_m3m3}</b></div>
    <div class="row"><span>Slope</span><b>${loc.inputs.slope_deg}°</b></div>
    <div class="row"><span>Elevation</span><b>${loc.inputs.elevation_m} m</b></div>
    <div class="action-box"><b>💡 Recommended action</b>${loc.recommended_action}</div>
    <div class="src">Weather: ${loc.data_sources.weather}<br/>Terrain: ${loc.data_sources.terrain}</div>
  `;
  panel.classList.add("show");
  document.getElementById("detail-close").addEventListener("click", () => panel.classList.remove("show"));
}

async function loadDashboard() {
  const btn = document.getElementById("refresh-btn");
  btn.classList.add("spinning");
  try {
    const res = await fetch("/api/dashboard");
    const data = await res.json();
    renderSummary(data.locations);
    renderList(data.locations);
    renderMarkers(data.locations);
    document.getElementById("last-updated").textContent =
      "Updated " + new Date(data.generated_at * 1000).toLocaleTimeString();
  } catch (e) {
    toast("Failed to load dashboard data", "error");
  }
  btn.classList.remove("spinning");
}

document.getElementById("refresh-btn").addEventListener("click", loadDashboard);

// ---------------------------------------------------------------
// Mobile sidebar drawer
// ---------------------------------------------------------------
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
document.getElementById("hamburger").addEventListener("click", () => {
  sidebar.classList.add("open");
  overlay.classList.add("show");
});
overlay.addEventListener("click", () => {
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
});
function closeSidebarOnMobile() {
  if (window.innerWidth <= 860) {
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
  }
}

// hide the map hint once the user interacts
map.once("click", () => {
  const hint = document.getElementById("map-hint");
  if (hint) hint.style.display = "none";
});

// ---------------------------------------------------------------
// State -> City/District dropdown wiring
// ---------------------------------------------------------------
const stateSelect = document.getElementById("state-select");
const citySelect = document.getElementById("city-select");
const latInput = document.getElementById("lat-input");
const lonInput = document.getElementById("lon-input");
const nameInput = document.getElementById("name-input");

Object.keys(INDIA_LOCATIONS).sort().forEach((state) => {
  const opt = document.createElement("option");
  opt.value = state;
  opt.textContent = state;
  stateSelect.appendChild(opt);
});

stateSelect.addEventListener("change", () => {
  const state = stateSelect.value;
  citySelect.innerHTML = '<option value="">Select City / District</option>';
  if (!state) { citySelect.disabled = true; return; }
  citySelect.disabled = false;
  INDIA_LOCATIONS[state].forEach((city) => {
    const opt = document.createElement("option");
    opt.value = city.name;
    opt.textContent = city.name;
    opt.dataset.lat = city.lat;
    opt.dataset.lon = city.lon;
    citySelect.appendChild(opt);
  });
});

citySelect.addEventListener("change", () => {
  const opt = citySelect.selectedOptions[0];
  if (!opt || !opt.dataset.lat) return;
  latInput.value = opt.dataset.lat;
  lonInput.value = opt.dataset.lon;
  nameInput.value = `${opt.value}, ${stateSelect.value}`;
});

async function checkLocation(lat, lon, name) {
  toast(`Fetching live data for ${name}…`);
  try {
    const res = await fetch(`/api/predict?lat=${lat}&lon=${lon}&name=${encodeURIComponent(name)}`);
    const loc = await res.json();
    loc.id = "custom-" + Date.now();
    map.flyTo([lat, lon], 11);
    const m = L.marker([lat, lon], { icon: markerIcon(loc.risk_level) }).addTo(map);
    m.bindPopup(`<b>${loc.name}</b><br/>Risk: <b style="color:${RISK_COLORS[loc.risk_level]}">${loc.risk_level}</b>`).openPopup();
    showDetail(loc);
    latInput.value = lat;
    lonInput.value = lon;
    nameInput.value = name;
    closeSidebarOnMobile();
    return loc;
  } catch (e) {
    toast("Could not fetch risk data. Try again.", "error");
  }
}

document.getElementById("check-btn").addEventListener("click", async () => {
  const lat = parseFloat(latInput.value);
  const lon = parseFloat(lonInput.value);
  const name = nameInput.value || "Custom location";
  if (isNaN(lat) || isNaN(lon)) {
    toast("Select a State + City, or enter latitude/longitude directly.", "error");
    return;
  }
  await checkLocation(lat, lon, name);
});

map.on("click", async (e) => {
  const lat = e.latlng.lat.toFixed(4);
  const lon = e.latlng.lng.toFixed(4);
  await checkLocation(lat, lon, `Map point (${lat}, ${lon})`);
});

loadDashboard();
</script>
